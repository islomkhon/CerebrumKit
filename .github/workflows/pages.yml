name: Demo (GitHub Pages)

# Publishes the panel as a static site: the real Vue build, answering from
# src/demo/fixtures.json instead of from a backend.
#
# Pages serves files, so there is no API and no model behind this. The banner
# across the top of the page says so, and chat replies are canned: it is a
# showcase of the interface, not a working install. `npm run build:demo` reads
# .env.demo (VITE_DEMO=1). No ordinary build sets that flag, so nothing here can
# change what a real deployment ships.
#
# One-time setup, by the repository owner: Settings -> Pages -> Build and
# deployment -> Source -> "GitHub Actions". Until that is set, this workflow
# fails at `configure-pages`, because a repository with no Pages site has
# nothing to configure.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/cerebrumkit-vue/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a running one finish rather than cancelling
# it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/cerebrumkit-vue/package-lock.json

      - name: Install
        working-directory: frontend/cerebrumkit-vue
        run: npm ci

      - name: Build
        working-directory: frontend/cerebrumkit-vue
        env:
          # A fork publishes under its own name without anyone editing a file.
          # On a <user>.github.io repository, or behind a custom domain, this
          # has to become "/".
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:demo

      - name: Refuse to publish a build that carries a credential
        working-directory: frontend/cerebrumkit-vue
        run: |
          # fixtures.json is rendered from a seeded install, and that install
          # holds a live key in backend/.env. The exporter redacts it; this is
          # what notices if it ever stops.
          leaks=$(grep -rhoE 'sk-[A-Za-z0-9_-]{24,}' dist/ | sort -u | grep -vx 'sk-demo-placeholder-not-a-real-key' || true)
          if [ -n "$leaks" ]; then
            echo "::error::a key-shaped string that is not the placeholder is in the build"
            # A prefix, so the run says which key leaked without publishing it.
            printf '%s\n' "$leaks" | cut -c1-12 | sed 's/$/.../'
            exit 1
          fi
          echo "the build carries only the placeholder key"

      - name: Answer deep links with the shell
        working-directory: frontend/cerebrumkit-vue
        run: |
          # Pages has no rewrite rules, so /CerebrumKit/client/projects is a
          # 404. Pages answers a 404 with 404.html, the shell boots, and the
          # router reads the path back out of the address bar.
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/cerebrumkit-vue/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5